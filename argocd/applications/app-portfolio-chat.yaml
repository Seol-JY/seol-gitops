apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-chat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Seol-JY/seol-gitops.git
    targetRevision: main
    path: apps/portfolio-chat
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
