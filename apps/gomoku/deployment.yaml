apiVersion: apps/v1
kind: Deployment
metadata:
  name: gomoku
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: gomoku
spec:
  # 방 상태와 SSE 팬아웃이 프로세스 메모리에 있어 파드 1개 고정, HPA 미적용
  replicas: 1
  # 파드 2개가 겹치면 방 상태가 갈린다. 짧은 끊김은 클라이언트가 Last-Event-ID 로 복구
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gomoku
  template:
    metadata:
      labels:
        app: gomoku
    spec:
      enableServiceLinks: false
      # 서버 shutdown timeout(10s) + 여유
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/seol-jy/gomoku-server
          imagePullPolicy: IfNotPresent  # 태그가 커밋 SHA, 내용 불변
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GOMOKU_BIND
              value: 0.0.0.0:3000
            - name: GOMOKU_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: gomoku-env, key: GOMOKU_DATABASE_URL }
            # 강제 업데이트 하한. 프로토콜이 깨지는 릴리스 뒤 유예 기간이 지나면 올린다
            - name: GOMOKU_MIN_CLIENT_VERSION
              value: "0.1.0"
            # 소프트 업데이트 안내. 클라이언트 릴리스마다 함께 올린다
            - name: GOMOKU_LATEST_CLIENT_VERSION
              value: "0.1.0"
            - name: GOMOKU_SHUTDOWN_TIMEOUT_SECS
              value: "10"
            - name: RUST_LOG
              value: info,tower_http=warn,sqlx=warn
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            # DB 를 보지 않는다, DB 장애에 파드 재시작을 엮지 않기 위함
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
