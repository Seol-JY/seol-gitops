apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gomoku
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api-gomoku.seol.pro]
  rules:
    - host: api-gomoku.seol.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gomoku
                port:
                  name: http
