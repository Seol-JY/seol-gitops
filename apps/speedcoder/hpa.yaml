apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: speedcoder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: speedcoder
  minReplicas: 2  # 노드 하나가 빠져도 남는 예비 파드
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
