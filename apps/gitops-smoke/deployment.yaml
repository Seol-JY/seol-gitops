apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-smoke
  labels:
    app: gitops-smoke
spec:
  selector:
    matchLabels:
      app: gitops-smoke
  template:
    metadata:
      labels:
        app: gitops-smoke
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway  # 노드 3대에 HPA 상한이 20 이라 분산보다 배치를 우선
          labelSelector:
            matchLabels:
              app: gitops-smoke
      containers:
        - name: smoke
          image: ghcr.io/seol-jy/seol-gitops-smoke
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
