apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gitops-smoke
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gitops-smoke
  minReplicas: 5   # HPA 가 부하를 감지하는 데 20초가 걸려 그 구간은 기존 파드만 버틴다
  maxReplicas: 20  # 20 개 × request 20m = 400m 으로 4 코어 클러스터의 10%, 폭주 시 상한 역할만 한다
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60  # 기본값 300 은 축소를 눈으로 확인하기에 너무 길어 줄였다, 프로덕션 기본은 300
