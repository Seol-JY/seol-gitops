apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # initdb 가 빈 데이터 디렉터리에서 한 번만 실행함, 덤프 복원보다 먼저 확장이 있어야 vector(1536) 컬럼과 uuid 기본값이 복원가능
  01-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS hstore;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
