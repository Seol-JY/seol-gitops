apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-chat
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-chat
  minReplicas: 2  # 노드 하나가 빠져도 남는 예비 파드
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # JVM 이 부팅 직후 JIT 로 CPU 를 태우므로 그 스파이크만 보고 늘리지 않게 한다
      stabilizationWindowSeconds: 60
