apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
spec:
  selector:
    app: toxiproxy
  ports:
    - name: ui
      port: 8080
      targetPort: ui
    - name: proxy-21001
      port: 21001
      targetPort: 21001
    - name: proxy-21002
      port: 21002
      targetPort: 21002
    - name: proxy-21003
      port: 21003
      targetPort: 21003
    - name: proxy-21004
      port: 21004
      targetPort: 21004
    - name: proxy-21005
      port: 21005
      targetPort: 21005
