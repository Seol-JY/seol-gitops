apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-admin.sealedsecret.yaml
configMapGenerator:
  - name: grafana-dashboard-hpa
    files:
      - hpa.json
    options:
      labels:
        grafana_dashboard: "1"  # Grafana sidecar 가 이 라벨로 ConfigMap 을 찾아 대시보드로 넣는다
  - name: grafana-dashboard-cluster
    files:
      - cluster.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true  # 이름이 고정이어야 sidecar 가 같은 대시보드의 갱신으로 인식한다
