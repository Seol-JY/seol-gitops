alertmanager:
  enabled: false
vmalert:
  enabled: false
defaultRules:
  enabled: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

vmsingle:
  spec:
    retentionPeriod: 7d
    nodeSelector:
      tier: data-b  # PVC 가 local-path(노드 로컬)라 파드가 이 노드에 고정
    storage:
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 512Mi

vmagent:
  spec:
    scrapeInterval: 15s
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

victoria-metrics-operator:
  # Argo CD 는 helm 의 lookup 을 빈 값으로 렌더링해 sync 마다 webhook TLS 인증서가 새로 생성됨
  # CR 은 이 차트의 values 로만 만들어 오타 검증의 값이 낮으므로 끈다
  admissionWebhooks:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

grafana:
  # 차트가 만드는 Secret 은 helm lookup 에 의존해 Argo CD 에서 sync 마다 비밀번호가 새로 생성된다
  # SealedSecret(infra/grafana/)을 참조하면 그 Secret 자체가 만들어지지 않는다
  # sidecar 가 이 자격으로 provisioning reload 를 호출해 datasource 등록이 시작 타이밍과 무관해진다
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    # 대시보드는 provisioning 폴더를 주기적으로 스캔하므로 reload 요청이 필요 없다
    # initDatasources/initDashboards 는 쓸 수 없다. 차트가 initContainer 에도 watchMethod(WATCH)를
    # 넘겨 initContainer 가 종료하지 않고, LIST 로 바꾸면 상시 sidecar 가 죽는다
    dashboards:
      skipReload: true
  env:
    # 차트의 plugins 옵션은 GF_INSTALL_PLUGINS 로 번역되는데, 이미지의 run.sh 가
    # GF_INSTALL_PLUGINS_FORCE=true 없이는 설치를 건너뛰므로 최신 변수를 직접 준다
    # SYNC 는 서버 기동 전에 설치를 끝낸다. 패널 플러그인은 기동 시점에 등록돼야 한다
    GF_PLUGINS_PREINSTALL_SYNC: marcusolsson-dynamictext-panel
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer  # 열람은 로그인 없이, 편집은 admin 로그인
    users:
      allow_sign_up: false
  ingress:
    enabled: false
  persistence:
    enabled: false  # 대시보드는 차트가 ConfigMap 으로 주입, 직접 만든 것은 JSON 으로 내보내 레포에 커밋
  nodeSelector:
    tier: data-b
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 640Mi  # 대시보드 39개를 provisioning 하며 실측 361Mi, 256Mi 로는 OOMKilled 됐다

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
