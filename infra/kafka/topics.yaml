apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: market-trades-v1
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: market.trades.v1
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000
    # 파티션당. local-path 가 PVC 크기를 강제하지 않아 이쪽이 유일한 디스크 방어선
    retention.bytes: 268435456
    # retention.bytes 보다 작아야 세그먼트가 실제로 삭제됨
    segment.bytes: 67108864
    min.insync.replicas: 2
    # 프로듀서가 zstd 로 압축한 것을 브로커가 다시 풀지 않음
    compression.type: producer
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
