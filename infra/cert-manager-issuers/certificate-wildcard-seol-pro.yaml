apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-seol-pro
  namespace: kube-system
spec:
  secretName: wildcard-seol-pro-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.seol.pro"
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
